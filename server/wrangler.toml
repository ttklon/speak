# Приёмник журналов ZSpeakly.
#
# Для развёртывания нужны аккаунт Cloudflare и настроенный Wrangler.
# Без LOGS_SECRET чтение и запись открыты всем, кто знает адрес.
# LOGS_SECRET закрывает и POST, но текущий desktop-клиент не отправляет ключ.
# Не разворачивайте публично без дополнительной защиты; см. README.md.
name = "zspeakly-logs"
main = "worker.mjs"
compatibility_date = "2024-11-01"
workers_dev = true

# Журнал: одна «комната» на приёмник, внутри SQLite
[[durable_objects.bindings]]
name = "LOGS"
class_name = "LogStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LogStore"]

[vars]
# Копия журналов в GitHub-репозиторий — только если сами захотите.
# Оставьте пустым: основное хранилище уже внутри воркера.
LOGS_REPO = ""
LOGS_BRANCH = "main"
