name: Release ZSpeakly

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, напр. v0.1.0"
        required: true
        default: "v0.1.0-test"

jobs:
  release:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build & Publish self-contained single-file (~80 МБ с рантаймом)
        run: |
          dotnet restore
          dotnet publish src/ZSpeakly.App/ZSpeakly.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish
        shell: pwsh

      - name: Zip
        run: Compress-Archive -Path publish/* -DestinationPath ZSpeakly-${{ github.ref_name }}-win-x64.zip -Force
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ZSpeakly-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
