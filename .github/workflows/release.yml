name: Release ZSpeakly

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, напр. v1.0.0"
        required: true
        default: "v1.0.0"

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Icons
        run: npm run icons

      - name: Tests
        run: npm test

      - name: Smoke main process
        run: npm run test:main

      - name: Build + package (NSIS + portable)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem release | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ZSpeakly ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release/*.exe
            release/*.blockmap
          body: |
            ## ZSpeakly — офлайн голосовой ввод

            Установщик и портативная версия — в ассетах.

            - **Диктовка** по `Ctrl+Alt+Space` в любое поле Windows 11
            - **Словарь**, который учится на ваших правках
            - **AI-инструкции** над выделенным текстом (`Ctrl+Alt+E/F/S/Q/T`)
            - **Буфер обмена** с источником «приложение — окно» и скриншотами

            Всё локально: без облака, аккаунта и подписки. Python не используется — только Electron.

            Для офлайн-распознавания запустите `scripts\download-models.ps1` (движок + модели).
          draft: false
          fail_on_unmatched_files: false
