name: Release ZSpeakly

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, напр. v1.0.0"
        required: true
        default: "v1.0.0"

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Icons
        run: npm run icons

      - name: Tests
        run: npm test

      - name: Build + package (NSIS + portable)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem release | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ZSpeakly ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release/*.exe
            release/*.blockmap
          body: |
            ## ZSpeakly — офлайн голосовой ввод

            Установщик и портативная версия в ассетах релиза.
            Диктовка (`Ctrl+Alt+Space`), живой перевод, заметки встреч, словарь и буфер обмена.
            Всё локально, без облака и подписки.
          draft: false
          fail_on_unmatched_files: false
