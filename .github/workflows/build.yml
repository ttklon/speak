name: Build ZSpeakly

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Быстрые проверки: тесты + сборка рендерера + смоук main-процесса
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Icons
        run: npm run icons

      - name: Tests (vitest)
        run: npm test

      - name: Smoke main process
        run: npm run test:main

      - name: Build renderer
        run: npm run build

      - name: Upload renderer
        uses: actions/upload-artifact@v4
        with:
          name: zspeakly-dist
          path: dist/
          retention-days: 7

  # 2. Сборка установщика для Windows
  package:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Icons
        run: npm run icons

      - name: Build + package (NSIS + portable)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder
        run: |
          npm run build 2>&1 | Tee-Object -FilePath build-renderer.log
          npx electron-builder --win nsis portable 2>&1 | Tee-Object -FilePath build-package.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build-package.log -Tail 120 | ForEach-Object { Write-Host $_ }
            Get-Content build-package.log -Tail 120 | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
            exit $LASTEXITCODE
          }

      - name: Verify artifacts
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter *.exe -ErrorAction SilentlyContinue
          Write-Host "Найдено exe: $($exe.Count)"
          $exe | ForEach-Object { Write-Host " - $($_.Name) $([math]::Round($_.Length/1MB,1)) МБ" }
          if (-not $exe) { throw "Установщик не собрался" }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: zspeakly-win-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 30

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          echo "### ZSpeakly — сборка установщика" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "Ветка: ``$env:GITHUB_REF_NAME`` · коммит ``$env:GITHUB_SHA.Substring(0,7)``" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem release -Filter *.exe -ErrorAction SilentlyContinue | ForEach-Object {
            echo "- **$($_.Name)** — $([math]::Round($_.Length/1MB,1)) МБ" >> $env:GITHUB_STEP_SUMMARY
          }
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "Скачать: вкладка **Actions** → этот запуск → *Artifacts* → ``zspeakly-win-x64``." >> $env:GITHUB_STEP_SUMMARY

  # 3. По тегу v* — публикуем релиз с установщиками
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zspeakly-win-x64
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ZSpeakly ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/latest.yml
