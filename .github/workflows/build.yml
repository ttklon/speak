name: Build ZSpeakly

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Быстрые проверки: тесты + сборка рендерера + смоук main-процесса
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        env:
          # electron-builder скачивает бинарник сам (с ретраями);
          # пост-установка electron тянет 100 МБ и рвёт всю сборку
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        # сеть на раннере иногда рвётся: до трёх попыток, потом npm install
        run: |
          for i in 1 2 3; do
            if npm ci --no-audit --no-fund; then exit 0; fi
            echo "::warning title=npm::попытка $i не удалась, повтор"
            sleep 10
          done
          npm install --no-audit --no-fund

      - name: Icons
        run: npm run icons

      - name: Tests (vitest)
        run: npm test

      - name: Smoke main process
        run: npm run test:main

      - name: Контракт IPC (нет каналов без обработчика)
        run: npm run check:ipc

      - name: Каналы обновлений
        run: npm run test:updater

      - name: Индекс настроек актуален
        run: npm run settings:index:check

      - name: Настройки не пустышки (каждая читается и находится)
        run: npm run check:settings

      - name: Build renderer
        run: npm run build

      - name: Upload renderer
        uses: actions/upload-artifact@v4
        with:
          name: zspeakly-dist
          path: dist/
          # 2 дня: рендерер пересоберётся за минуту, хранить его месяц незачем
          retention-days: 2

  # 2. Сборка установщика для Windows
      - name: Тест настоящего движка распознавания (whisper.cpp)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Проверяем не заглушку, а настоящий whisper-cli: аргументы, разбор
        # результата, удаление .out.txt и отмену прохода. Недоступные сборка
        # или модель отмечаются предупреждением и пропуском; если сам тест
        # запустился и упал, его ошибка должна остановить выпуск.
        run: |
          set -u
          # Если подготовка завершится раньше самого теста, фиксируем место
          # сбоя даже когда GitHub не отдаёт полный журнал задания.
          trap 'status=$?; echo "::error title=whisper-live::Ошибка подготовки (строка $LINENO, код $status)"' ERR
          mkdir -p /tmp/wtest && cd /tmp/wtest
          # Пропуск при ошибке подготовки, а не неожиданный выход bash с -e.
          if ! url=$(curl -fsS --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" 'https://api.github.com/repos/ggml-org/whisper.cpp/releases?per_page=30' \
            | grep -o '"browser_download_url": *"[^"]*whisper-bin-ubuntu-x64.tar.gz"' \
            | sed -n '1{s/.*"\(https[^"]*\)"/\1/;p;}'); then
            url=""
          fi
          if [ -z "$url" ]; then
            echo "::warning title=whisper.cpp::список релизов недоступен или в нём нет сборки для Linux — тест пропущен"
            exit 0
          fi
          if ! curl -fL --retry 3 --retry-delay 5 "$url" -o w.tar.gz; then
            echo "::warning title=whisper.cpp::сборка не скачалась (сеть раннера) — тест пропущен"
            exit 0
          fi
          if ! tar xzf w.tar.gz; then
            echo "::warning title=whisper.cpp::архив не распаковался — тест пропущен"
            exit 0
          fi
          bin=$(find /tmp/wtest -name 'whisper-cli' -type f | head -1)
          if [ -z "$bin" ]; then
            echo "::warning title=whisper.cpp::в архиве нет whisper-cli — тест пропущен"
            exit 0
          fi
          cd "$GITHUB_WORKSPACE"
          if ! git clone --depth 1 -q --filter=blob:none --sparse https://github.com/ggml-org/whisper.cpp /tmp/wmodels; then
            echo "::warning title=whisper.cpp::тестовые модели недоступны — тест пропущен"
            exit 0
          fi
          git -C /tmp/wmodels sparse-checkout set models
          model=/tmp/wmodels/models/for-tests-ggml-tiny.bin
          if [ ! -f "$model" ]; then
            echo "::warning title=whisper.cpp::тестовая модель не скачалась — тест пропущен"
            exit 0
          fi
          libdir=$(dirname "$(find /tmp/wtest -name 'libwhisper.so*' | head -1)")
          # VAD-модель: если раннер достанет её с HuggingFace, живой тест проверит
          # и `--vad` на релизной сборке whisper.cpp. Недоступность — не ошибка.
          vad=""
          if curl -fsSL --retry 2 --retry-delay 5 --max-time 120 \
            'https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin' -o /tmp/vad.bin; then
            if [ "$(stat -c%s /tmp/vad.bin)" -gt 500000 ]; then
              vad=/tmp/vad.bin
              echo "::notice title=vad::модель Silero скачана, тест пойдёт с --vad"
            fi
          fi
          if [ -z "$vad" ]; then
            echo "::warning title=vad::HuggingFace недоступен — живой тест без VAD"
          fi
          set -o pipefail
          # Логи упавших джобов GitHub иногда не отдаёт совсем (EOF), поэтому
          # причину провала выносим в аннотацию — её видно в интерфейсе.
          # GitHub запускает bash с -e: временно отключаем его, чтобы успеть
          # записать причину и затем явно вернуть исходный код теста.
          trap - ERR
          set +e
          ZS_WHISPER_BIN="$bin" ZS_WHISPER_MODEL="$model" ZS_WHISPER_LIB_DIR="$libdir" ZS_WHISPER_VAD="$vad" \
            LD_LIBRARY_PATH="$libdir:${LD_LIBRARY_PATH:-}" npm run test:whisper 2>&1 | tee /tmp/wt.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            tail -c 900 /tmp/wt.log | tr '\n' ' ' | sed 's/%/%25/g' > /tmp/wt-msg.txt
            echo "::warning title=whisper-live::$(cat /tmp/wt-msg.txt)"
            exit "$code"
          fi

  package:
    needs: check
    # На каждый коммит в рабочую ветку установщик не собираем: 170 МБ артефактов
    # на коммит — так и переполняется хранилище. Полная упаковка — на main, теги
    # и ручной запуск (workflow_dispatch), плюс pull_request для проверки.
    if: >-
      github.event_name != 'push'
      || !startsWith(github.ref, 'refs/heads/arena/')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        # пост-установка electron тянет 100 МБ и часто отваливается;
        # бинарник качаем отдельным шагом с проверкой результата
        # сеть на раннере рвётся: до трёх попыток, потом npm install
        run: |
          for i in 1 2 3; do
            if npm ci --no-audit --no-fund; then exit 0; fi
            echo "::warning title=npm::попытка $i не удалась, повтор"
            sleep 10
          done
          npm install --no-audit --no-fund

      - name: Icons
        run: npm run icons

      - name: Загрузка и отмена моделей на Windows
        run: npx vitest run src/lib/modelDownload.test.js src/lib/whisperDownload.test.js src/lib/engineDownload.test.js src/lib/modelImport.test.js src/lib/modelDiscovery.test.js

      - name: Помощник ввода (C# → exe) собирается и отвечает
        shell: bash
        # Вставка текста в чужие окна держится на этом помощнике. Собрать его
        # можно только на Windows, поэтому проверяем здесь: если C# перестанет
        # компилироваться, сборка упадёт сейчас, а не у человека, который
        # нажимает «диктовка» и не получает текста.
        run: node scripts/check-wininput.cjs

      - name: Кэш Electron (переживает сетевые сбои раннера)
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/AppData/Local/electron-builder-binaries
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-

      - name: Прогреть бинарник Electron (с ретраями)
        shell: bash
        # electron-builder скачивает Electron сам; делаем это заранее и с повторами,
        # чтобы сбой сети не валил всю упаковку
        run: |
          check() {
            node -e "try{const p=require('electron');process.exit(p&&p.length>3?0:1)}catch(e){process.exit(1)}" 2>/dev/null
          }
          for i in 1 2 3 4 5 6; do
            echo "::notice title=electron::прогрев, попытка $i"
            check && break
            if [ ! -f node_modules/electron/dist/electron.exe ]; then
              node node_modules/electron/install.js || true
            fi
            sleep 20
          done
          if check; then
            echo "::notice::бинарник Electron на месте: $(node -e "process.stdout.write(require('electron'))")"
          else
            echo "::warning title=electron::бинарник не скачался, electron-builder попробует сам"
          fi

      - name: Прогреть бинарники electron-builder (NSIS и др.)
        shell: bash
        # nsis/winCodeSign качаются с github releases и иногда отдают 504 —
        # повторяем до пяти раз, дальше настоящая упаковка тоже с повторами
        run: |
          for i in 1 2 3 4 5; do
            echo "::notice title=electron-builder::прогрев бинарников, попытка $i"
            npx electron-builder --win nsis --publish never > warmup.log 2>&1 || true
            if [ -z "$(grep -E 'status code 50[0-9]|Cannot|ENOTFOUND|ETIMEDOUT' warmup.log)" ]; then
              echo "::notice::бинарники на месте"
              exit 0
            fi
            sleep 25
          done
          echo "::warning title=electron-builder::бинарники не скачались заранее, пробуем в самой упаковке"

      - name: Движок распознавания whisper.cpp в установщик
        shell: pwsh
        # Без whisper-cli.exe офлайн-диктовка не работает вовсе: человек
        # скачивал модель и получал «движок не установлен». Кладём бинарник
        # в build/bin, package.json отдаёт его в resources/bin.
        run: |
          New-Item -ItemType Directory -Force -Path build/bin | Out-Null
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            try {
              $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'ZSpeakly-CI' } `
                'https://api.github.com/repos/ggml-org/whisper.cpp/releases?per_page=30'
              $asset = $null
              foreach ($r in $rel) {
                $a = $r.assets | Where-Object { $_.name -eq 'whisper-bin-x64.zip' } | Select-Object -First 1
                if ($a) { $asset = $a; break }
              }
              if (-not $asset) { throw 'whisper-bin-x64.zip нет в релизах ggml-org/whisper.cpp' }
              Write-Host "::notice title=whisper.cpp::качаем $($asset.name) из $($r.tag_name)"
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile build/whisper.zip
              Expand-Archive build/whisper.zip -DestinationPath build/whisper -Force
              Get-ChildItem -Path build/whisper -Recurse -Include *.exe, *.dll |
                Where-Object { $_.Name -match '^(whisper-cli|whisper-server)\.exe$' -or $_.Extension -eq '.dll' } |
                ForEach-Object { Copy-Item $_.FullName build/bin -Force }
              if (Test-Path build/bin/whisper-cli.exe) { $ok = $true }
            } catch {
              Write-Host "::warning title=whisper.cpp::попытка $i не удалась: $_"
              Start-Sleep -Seconds 15
            }
          }
          if (-not $ok) {
            Write-Host '::warning title=whisper.cpp::бинарник не попал в сборку — приложение докачает его при первом запуске'
          }
          if (Test-Path build/bin/whisper-server.exe) {
            # Именно он держит веса в памяти и прогревается в начале записи:
            # без него каждая диктовка начинается с загрузки модели.
            Write-Host '::notice title=whisper.cpp::whisper-server.exe в сборке — прогрев и быстрая диктовка работают'
          } else {
            Write-Host '::warning title=whisper.cpp::в архиве нет whisper-server.exe — прогрев недоступен, диктовка пойдёт холодным whisper-cli'
          }
          Get-ChildItem build/bin | Select-Object Name, Length

      - name: VAD-модель (Silero) в установщик
        shell: pwsh
        # 864 КБ, но именно она отсекает тишину: с ней диктовка отвечает
        # быстрее и не выдумывает фраз на пустом звуке. Файл кладём в models/,
        # extraResources отдаёт его в resources/models. Шаг намеренно не валит
        # сборку: если модели нет, приложение докачает её само (models:prepare).
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path models | Out-Null
          $dest = 'models/ggml-silero-v6.2.0.bin'
          $url = 'https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin'
          for ($i = 1; $i -le 3; $i++) {
            if (Test-Path $dest) { break }
            try {
              Invoke-WebRequest -Uri $url -OutFile $dest -TimeoutSec 120
              if ((Get-Item $dest).Length -lt 500000) { Remove-Item $dest -Force }
            } catch {
              Write-Host "::warning title=vad::HuggingFace, попытка $i`: $($_.Exception.Message)"
              if (Test-Path $dest) { Remove-Item $dest -Force }
              Start-Sleep -Seconds 5
            }
          }
          if (-not (Test-Path $dest)) {
            # Те же веса Silero лежат в пакете silero-vad на PyPI: собираем
            # ggml-файл сами (формат сверен с официальным whisper.cpp).
            Write-Host '::notice title=vad::HuggingFace недоступен, собираем модель из пакета silero-vad'
            $py = 'python'
            try { & $py --version 2>&1 | Out-Null } catch { $py = 'py' }
            try {
              & $py -m pip install --no-deps silero-vad numpy 2>&1 | Out-Null
              & $py scripts/make-vad-model.py --out $dest 2>&1 | ForEach-Object { Write-Host $_ }
            } catch {
              Write-Host "::warning title=vad::сборка из пакета не удалась: $($_.Exception.Message)"
            }
          }
          if (Test-Path $dest) {
            Get-Item $dest | Select-Object Name, Length
          } else {
            Write-Host '::warning title=vad::модель не попала в сборку — приложение докачает её при первом запуске'
          }
          exit 0

      - name: Build + package (NSIS + portable)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder
        run: |
          npm run build 2>&1 | Tee-Object -FilePath build-renderer.log

          # Загрузка бинарника Electron иногда падает на сетевом сбое раннера:
          # три попытки, между ними — пауза. Это не ошибка нашего кода.
          $attempt = 0
          $ok = $false
          while ($attempt -lt 3 -and -not $ok) {
            $attempt++
            Write-Host "::notice title=electron-builder::попытка $attempt из 3"
            # --publish never: релиз публикуем отдельным job только по тегу
            # указываем готовый дистрибутив из node_modules: electron-builder
            # не будет ничего скачивать и не упадёт на сетевом сбое раннера
            $dist = (node -e "process.stdout.write(require('electron'))" | Select-Object -Last 1)
            Write-Host "::notice title=electron::дистрибутив $dist"
            if (-not (Test-Path $dist)) { Write-Host "::error title=electron::дистрибутив не найден: $dist"; }
            Remove-Item -Recurse -Force dist-electron -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path dist-electron | Out-Null
            Copy-Item -Recurse -Force $dist dist-electron/win-unpacked
            npx electron-builder --win nsis portable --publish never 2>&1 | Tee-Object -FilePath build-package.log
            if ($LASTEXITCODE -eq 0) { $ok = $true }
            elseif ($attempt -lt 3) {
              # Повторяем на любой сбой упаковки: основная причина — сеть раннера
              # при скачивании бинарника Electron (ERR_ELECTRON_BUILDER_CANNOT_EXECUTE).
              $log = Get-Content build-package.log -Raw
              $hint = ($log -split "`n" | Where-Object { $_ -match 'Error|error|failed|Cannot' } | Select-Object -Last 1)
              Write-Host "::warning title=electron-builder::попытка $attempt не удалась: $hint"
              Start-Sleep -Seconds 30
            }
          }

          if (-not $ok) {
            $all = Get-Content build-package.log -ErrorAction SilentlyContinue
            $all | Where-Object { $_ -match '⨯|Error|error:|failed|Cannot|cannot|ENOENT|EPERM' } |
              Select-Object -First 20 | ForEach-Object {
                $line = ($_ -replace '[\r\n]+', ' ').Trim()
                if ($line) { Write-Host "::warning title=electron-builder::$line" }
              }

            # NSIS и winCodeSign качаются с GitHub CDN и иногда отдают 504 —
            # это сбой на их стороне. Тогда собираем дистрибутив без инсталлятора:
            # ZIP с уже распакованным приложением остаётся полностью рабочим.
            Write-Host "::warning title=electron-builder::NSIS недоступен, собираем portable ZIP"
            npx electron-builder --win dir --publish never 2>&1 | Tee-Object -FilePath build-zip.log
            if ($LASTEXITCODE -ne 0) {
              Get-Content build-zip.log -Tail 20 | ForEach-Object {
                $line = ($_ -replace '[\r\n]+', ' ').Trim()
                if ($line) { Write-Host "::error title=electron-builder::$line" }
              }
              exit 1
            }
            $unpacked = Get-ChildItem dist-electron -Directory -Filter 'win-unpacked' -ErrorAction SilentlyContinue
            $source = if ($unpacked) { $unpacked.FullName } else { 'release/win-unpacked' }
            if (-not (Test-Path $source)) {
              Write-Host "::error title=electron-builder::распакованное приложение не найдено"
              exit 1
            }
            $zip = "release/ZSpeakly-$(node -p "require('./package.json').version")-win-x64.zip"
            Compress-Archive -Path "$source\*" -DestinationPath $zip -Force
            Write-Host "::notice title=package::собран ZIP: $zip"
            exit 0
          }

      - name: Verify artifacts
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter *.exe -ErrorAction SilentlyContinue
          $zip = Get-ChildItem release -Filter *.zip -ErrorAction SilentlyContinue
          Write-Host "Найдено exe: $($exe.Count), zip: $($zip.Count)"
          @($exe) + @($zip) | ForEach-Object { if ($_) { Write-Host " - $($_.Name) $([math]::Round($_.Length/1MB,1)) МБ" } }
          if (-not $exe -and -not $zip) { throw "Ни установщика, ни ZIP не собралось" }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-package.log
            build-renderer.log
          retention-days: 3

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: zspeakly-win-x64
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          # 2 дня: установщик весит ~170 МБ, а прежние 30 дней забивали
          # хранилище Actions на многие гигабайты
          retention-days: 2

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          echo "### ZSpeakly — сборка установщика" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "Ветка: ``$env:GITHUB_REF_NAME`` · коммит ``$env:GITHUB_SHA.Substring(0,7)``" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem release -Include *.exe, *.zip -ErrorAction SilentlyContinue | ForEach-Object {
            echo "- **$($_.Name)** — $([math]::Round($_.Length/1MB,1)) МБ" >> $env:GITHUB_STEP_SUMMARY
          }
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "Скачать: вкладка **Actions** → этот запуск → *Artifacts* → ``zspeakly-win-x64``." >> $env:GITHUB_STEP_SUMMARY

  # 3. По тегу v* — публикуем релиз с установщиками
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zspeakly-win-x64
          path: artifacts

      - name: Проверка артефактов
        run: |
          ls -la artifacts
          test -f artifacts/latest.yml || echo "::warning::latest.yml не собрался — автообновление не увидит версию"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ZSpeakly ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.blockmap
            artifacts/latest.yml
