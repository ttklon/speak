name: Build ZSpeakly

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Быстрая проверка на облачных раннерах: тесты + сборка рендерера
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Icons
        run: npm run icons

      - name: Tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Upload renderer
        uses: actions/upload-artifact@v4
        with:
          name: zspeakly-dist
          path: dist/
          retention-days: 7

  # Сборка установщика на Windows (твой self-hosted runner или windows-latest)
  package:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Icons
        run: npm run icons

      - name: Build + package
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: zspeakly-win-x64
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 14

      - name: Summary
        shell: pwsh
        run: |
          echo "### ZSpeakly собрана" >> $env:GITHUB_STEP_SUMMARY
          echo "Ветка: $env:GITHUB_REF_NAME" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            echo "- $($_.Name) — $([math]::Round($_.Length/1MB,1)) МБ" >> $env:GITHUB_STEP_SUMMARY
          }
