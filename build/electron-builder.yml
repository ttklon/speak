# Только для CI-релиза.
#
# 1) publish — чтобы electron-builder сгенерировал latest.yml (по нему работает
#    автообновление). Локальная сборка этот файл не использует.
# 2) electronDist — берём уже распакованный Electron из node_modules, чтобы
#    упаковка не зависела от сети раннера (скачивание часто отваливается).
publish:
  provider: github
  owner: ttklon
  repo: speak
  releaseType: release

electronDist: dist-electron

# Движок распознавания и (если положили рядом) веса — в ресурсы приложения.
# Дублирует package.json: build — electron-builder читает этот файл в CI, и
# конфигурации должны совпадать, чтобы установщик всегда содержал whisper-cli.
extraResources:
  - from: build/bin
    to: bin
    filter:
      - "**/*"
  - from: models
    to: models
    filter:
      - "**/*.bin"
