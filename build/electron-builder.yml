# Только для CI-релиза.
#
# 1) publish — чтобы electron-builder сгенерировал latest.yml (по нему работает
#    автообновление). Локальная сборка этот файл не использует.
# 2) electronDist — берём уже распакованный Electron из node_modules, чтобы
#    упаковка не зависела от сети раннера (скачивание часто отваливается).
publish:
  provider: github
  owner: ttklon
  repo: speak
  releaseType: release

electronDist: dist-electron
